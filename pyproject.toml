[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-mask-attack"
version = "0.1.0"
description = "Detection-preserving mask-selective attacks for YOLO instance segmentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy==1.26.4",
  "opencv-python==4.11.0.86",
  "Pillow==11.3.0",
  "PyYAML==6.0.3",
  "torch==2.5.1",
  "torchvision==0.20.1",
  "ultralytics==8.4.157",
]

[project.optional-dependencies]
eval = ["faster-coco-eval==1.8.0", "pycocotools==2.0.11", "scipy==1.13.1"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
yolo-mask-attack = "yolo_mask_attack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
