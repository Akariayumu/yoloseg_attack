name: yolo-mask-selective
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pytorch=2.5.1
  - torchvision=0.20.1
  - pytorch-cuda=12.1
  - numpy=1.26
  - scipy=1.13
  - pyyaml=6.0
  - pip:
      - numpy==1.26.4
      - opencv-python==4.11.0.86
      - Pillow==11.3.0
      - -e ./repos/models/ultralytics
      - -e .[dev,eval]
